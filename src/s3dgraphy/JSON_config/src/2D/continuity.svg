<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_2" data-name="Layer 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22.52 22.52">
  <defs>
    <style>
      .cls-1 {
        fill: #000;
        stroke-width: 0px;
      }
    </style>
  </defs>
  <g id="Layer_1-2" data-name="Layer 1">
    <!-- The 45° rotation is what makes this a DIAMOND: same centred box, turned.
         POL4 removed it to follow the (wrong) square, POL5 puts it back — BR is a
         rhombus in EM, and it is also what the GraphML exporter emits
         (<Shape type="diamond"/>), so a square glyph here would have contradicted
         both the canvas and the round-trip. -->
    <rect class="cls-1" x="3.25" y="3.35" width="16.02" height="15.83" transform="translate(-4.66 11.26) rotate(-45)"/>
  </g>
</svg>